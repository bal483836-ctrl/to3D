name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r backend/requirements-dev.txt
          pip install -r dataset_tool/requirements.txt pytest
      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q
      - name: Run dataset_tool tests
        working-directory: dataset_tool
        run: python -m pytest -q

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f backend/Dockerfile -t to3d:ci .
      - name: Smoke test container
        run: |
          docker run -d --name to3d -p 8000:8000 to3d:ci
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/api/health; then echo OK; break; fi
            sleep 2
          done
          curl -sf http://127.0.0.1:8000/api/health
          docker rm -f to3d
