<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>图/文双通道 3D 生成</title>
  <link rel="stylesheet" href="./styles.css" />
  <script type="importmap">
  { "imports": { "three": "./vendor/three.module.min.js" } }
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">◉</span> 图/文生 3D</div>
    <div class="sub">图 + 文 同时作为条件 · 联合生成一份模型 · 一致性自检修正</div>
  </header>

  <main class="layout">
    <!-- 左侧：输入面板 -->
    <section class="panel">
      <div class="seg" id="modeSeg">
        <span data-v="joint" class="on">图文联合生成</span>
      </div>

      <label class="lbl"><span class="star">★</span> 文字描述（与图片同时作为生成条件）</label>
      <textarea id="prompt" rows="3" placeholder="例如：青花瓷花瓶，细长颈，圈足，缠枝莲纹，釉面高光"></textarea>
      <div class="examples">
        <button class="ex">青花瓷花瓶，细长颈，圈足，缠枝莲纹，釉面高光</button>
        <button class="ex">金属机器人摆件，矮胖，平底，对称，磨砂哑光</button>
        <button class="ex">陶器，三足，西周，高17.5、口径16.5公分</button>
      </div>

      <label class="lbl">模态引导权重（图与文同时生效）</label>
      <div class="strat" id="strat">
        <label class="opt on"><input type="radio" name="strategy" value="image_primary" checked/> 图像引导更强</label>
        <label class="opt"><input type="radio" name="strategy" value="balanced"/> 图文均衡</label>
        <label class="opt"><input type="radio" name="strategy" value="text_correct"/> 文字引导更强</label>
      </div>

      <div class="grid2">
        <div>
          <label class="lbl">一致性阈值 <b id="thVal">0.80</b></label>
          <input type="range" id="threshold" min="0.5" max="0.95" step="0.05" value="0.8"/>
        </div>
        <div>
          <label class="lbl">最大修正轮数</label>
          <select id="maxRounds"><option>1</option><option selected>2</option><option>3</option></select>
        </div>
      </div>

      <label class="opt inline"><input type="checkbox" id="hil"/> 人在环（每轮修正前暂停确认）</label>

      <button id="genBtn" class="gen">✦ 立即生成</button>
      <div id="err" class="err"></div>

      <!-- 已有模型：跳过生成，直接跑后续任务 -->
      <div class="upl">
        <label class="lbl">已有 3D 模型？直接生成 50 视角数据集</label>
        <input type="file" id="upFile" accept=".glb,.gltf,.obj,.fbx,.ply" hidden />
        <button id="upBtn" class="ds-btn">⬆ 上传模型（GLB/GLTF/OBJ/FBX/PLY）</button>
        <div id="upName" class="upl-name"></div>
        <div id="upStatus" class="ds-status"></div>
        <p class="hint">无需先跑生成。渲染 Color/Depth/Normal/Mask 四模态，需服务端装有 Blender。</p>
      </div>
    </section>

    <!-- 中间：多视图上传 -->
    <section class="panel center">
      <div class="phead">添加多视图（Min 2，Max 8）<span id="imgCount">0 / 8</span></div>
      <div class="viewgrid" id="viewgrid"></div>
      <p class="hint">点击槽位选择图片。<span class="req-note">正图为必填</span>。未上传的视角，其对应维度将改由文字约束校正。</p>
    </section>

    <!-- 右侧：进度 + 报告 + 预览 -->
    <section class="panel right">
      <div id="stages" class="stages"></div>
      <div id="viewerWrap" class="viewer" hidden><canvas id="viewer"></canvas></div>
      <div id="report" class="report" hidden></div>
      <div id="decision" class="decision" hidden></div>
      <div id="downloads" class="downloads" hidden></div>
      <div id="dataset" hidden></div>
    </section>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
